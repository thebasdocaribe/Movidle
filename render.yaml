services:
  - type: web
    name: cineblitz
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: cineblitz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_TEMPLATE_VERIFY
        sync: false
      - key: EMAILJS_TEMPLATE_RESET
        sync: false
      - key: EMAIL_FROM_NAME
        value: CineBlitz

databases:
  - name: cineblitz-db
    plan: free
    databaseName: cineblitz
    user: cineblitz
